<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <title>Tachyon AIO — V15 Preview</title>
  <style>
    html,body{height:100%;margin:0;background:#050505;color:#fff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{display:grid;place-items:center}
    .loader{width:min(420px,calc(100vw - 48px));text-align:center}
    .mark{width:42px;height:42px;margin:0 auto 18px;border:1px solid rgba(255,255,255,.18);border-radius:50%;display:grid;place-items:center;animation:pulse 1.15s ease-in-out infinite}
    .mark:after{content:"";width:10px;height:10px;border-radius:50%;background:#fff}
    h1{font-size:15px;letter-spacing:.18em;text-transform:uppercase;margin:0 0 10px}
    p{margin:0;color:rgba(255,255,255,.55);font-size:13px;line-height:1.5}
    pre{display:none;margin-top:18px;padding:14px;text-align:left;white-space:pre-wrap;word-break:break-word;border:1px solid rgba(255,255,255,.12);border-radius:10px;color:#ffb4b4;background:#0b0b0b;font-size:12px}
    @keyframes pulse{50%{opacity:.42;transform:scale(.94)}}
  </style>
</head>
<body>
  <div class="loader" id="loader">
    <div class="mark"></div>
    <h1>Tachyon V15 Preview</h1>
    <p id="status">Loading exact preview…</p>
    <pre id="error"></pre>
  </div>
  <script>
  (() => {
    const parts = [
      'preview_parts/p00.txt',
      'preview_parts/p01.txt',
      'preview_parts/p02_03.txt',
      'preview_parts/p04_05.txt',
      'preview_parts/p06_07.txt',
      'preview_parts/p08_09.txt'
    ];

    const status = document.getElementById('status');
    const errorBox = document.getElementById('error');

    function fail(err) {
      console.error('[Tachyon V15 preview loader]', err);
      status.textContent = 'Preview failed to load.';
      errorBox.style.display = 'block';
      errorBox.textContent = String(err && (err.stack || err.message) || err);
    }

    async function inflateGzip(bytes) {
      if (!('DecompressionStream' in window)) {
        throw new Error('This browser does not support DecompressionStream. Use a current Chrome, Edge, Firefox, or Safari build.');
      }
      const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
      return new Uint8Array(await new Response(stream).arrayBuffer());
    }

    async function load() {
      try {
        const encodedParts = [];
        for (let i = 0; i < parts.length; i++) {
          status.textContent = `Loading exact preview… ${i + 1}/${parts.length}`;
          const response = await fetch(new URL(parts[i], location.href), { cache: 'no-store' });
          if (!response.ok) throw new Error(`${parts[i]} returned HTTP ${response.status}`);
          encodedParts.push(await response.text());
        }

        status.textContent = 'Assembling V15…';
        const encoded = encodedParts.join('').replace(/\s+/g, '');
        if (!encoded.startsWith('H4sI')) throw new Error('V15 payload header is invalid or incomplete.');

        let binary;
        try {
          binary = atob(encoded);
        } catch (err) {
          throw new Error(`V15 base64 payload could not be decoded: ${err.message}`);
        }

        const compressed = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) compressed[i] = binary.charCodeAt(i);

        status.textContent = 'Opening V15…';
        const inflated = await inflateGzip(compressed);
        const html = new TextDecoder('utf-8', { fatal: true }).decode(inflated);

        if (!/<!doctype\s+html/i.test(html) && !/<html[\s>]/i.test(html)) {
          throw new Error('Decoded V15 payload is not an HTML document.');
        }

        document.open();
        document.write(html);
        document.close();
      } catch (err) {
        fail(err);
      }
    }

    load();
  })();
  </script>
</body>
</html>
