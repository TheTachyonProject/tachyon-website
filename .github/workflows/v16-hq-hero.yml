name: Validate V16 production site

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - '.github/workflows/v16-hq-hero.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate production homepage
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          html = Path('index.html').read_text(encoding='utf-8')
          required = [
              'Tachyon Website V16',
              'https://whop.com/checkout/plan_DulX0ELfxzSyT',
              'https://whop.com/checkout/plan_73Ny0h9vbhLlp',
              'https://whop.com/checkout/plan_7NQhyigSMh7iu',
              'https://whop.com/checkout/plan_3AurEJr6b252f',
              'data:image/webp;base64,',
          ]
          missing = [value for value in required if value not in html]
          if missing:
              raise SystemExit('Missing required production content: ' + ', '.join(missing))

          hero = Path('assets/hero.webp')
          if not hero.exists() or hero.stat().st_size < 1000:
              raise SystemExit('Hero asset is missing or invalid')

          print('V16 production validation passed')
          print('index.html bytes:', Path('index.html').stat().st_size)
          print('hero.webp bytes:', hero.stat().st_size)
          PY
