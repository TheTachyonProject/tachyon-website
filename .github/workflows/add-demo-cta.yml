name: Wire responsive homepage demo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-demo-cta.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Switch hero to responsive desktop and mobile demos
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text()

          # Desktop starts with the compact sidebar app. Mobile is swapped in by the responsive script below.
          html, n = re.subn(
              r'(<iframe\b[^>]*class="tachyon-demo-frame"[^>]*\bsrc=")[^"]+("[^>]*></iframe>)',
              r'\1/demo/embed.html\2',
              html,
              count=1,
          )
          if n != 1:
              raise SystemExit(f'Expected one Tachyon demo iframe, found {n}')

          fit_id = 'tachyon-compact-demo-fit'
          fit_css = '''<style id="tachyon-compact-demo-fit">
          /* Desktop = compact sidebar app. Mobile = dedicated Tasks-first preview. Both fit without internal vertical scrolling. */
          .tachyon-demo-frame{height:455px!important;overflow:hidden!important}
          @media(max-width:900px){.tachyon-demo-frame{height:430px!important}}
          @media(max-width:620px){
            .tachyon-demo-frame{height:405px!important}
            .tachyon-demo-caption{height:32px!important}
          }
          </style>'''
          if fit_id in html:
              start = html.index('<style id="tachyon-compact-demo-fit">')
              end = html.index('</style>', start) + len('</style>')
              html = html[:start] + fit_css + html[end:]
          else:
              html = html.replace('</head>', fit_css + '</head>', 1)

          script_id = 'tachyon-responsive-demo-source'
          responsive_script = '''<script id="tachyon-responsive-demo-source">
          (() => {
            const frame = document.querySelector('.tachyon-demo-frame');
            if (!frame) return;
            const mobile = window.matchMedia('(max-width: 620px)');
            const sync = () => {
              const next = mobile.matches ? '/demo/mobile-embed.html' : '/demo/embed.html';
              const current = new URL(frame.src, window.location.href).pathname;
              if (current !== next) frame.src = next;
            };
            sync();
            if (mobile.addEventListener) mobile.addEventListener('change', sync);
            else mobile.addListener(sync);
          })();
          </script>'''
          if script_id in html:
              start = html.index('<script id="tachyon-responsive-demo-source">')
              end = html.index('</script>', start) + len('</script>')
              html = html[:start] + responsive_script + html[end:]
          else:
              html = html.replace('</body>', responsive_script + '</body>', 1)

          if 'src="/demo/embed.html"' not in html:
              raise SystemExit('Desktop compact demo verification failed')
          if '/demo/mobile-embed.html' not in html:
              raise SystemExit('Mobile demo source verification failed')

          path.write_text(html)
          PY
      - name: Commit homepage patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Tachyon Website Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Use dedicated mobile Tachyon hero demo'
          git push origin HEAD:main
