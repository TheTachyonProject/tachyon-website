name: Wire interactive demo CTA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-demo-cta.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch homepage layout
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text()

          marker = 'tachyon-demo-cta'
          target = '<a class="btn primary" href="#pricing">Get access</a>'
          demo = '<a class="btn tachyon-demo-cta" href="/demo/" style="background:#101010!important;color:#fff!important;border-color:#3a3a3a!important">Try Tachyon</a>'
          if marker not in html:
              count = html.count(target)
              if count < 1:
                  raise SystemExit('Could not find production Get access CTA anchor')
              html = html.replace(target, demo + target)

          fix_id = 'tachyon-mobile-nav-fix'
          mobile_fix = '''<style id="tachyon-mobile-nav-fix">
          @media(max-width:580px){
            .nav .nav-inner{gap:8px!important}
            .nav .nav-actions{gap:6px!important}
            .nav .nav-actions .tachyon-demo-cta,
            .nav .nav-actions .btn.primary{
              width:auto!important;min-width:0!important;min-height:0!important;
              padding:8px 11px!important;font-size:11px!important;line-height:1.1!important;
              white-space:nowrap!important;border-radius:999px!important;
            }
            .nav .mobile-toggle{font-size:22px!important;padding:4px!important;line-height:1!important}
          }
          </style>'''
          if fix_id in html:
              start = html.index('<style id="tachyon-mobile-nav-fix">')
              end = html.index('</style>', start) + len('</style>')
              html = html[:start] + mobile_fix + html[end:]
          else:
              html = html.replace('</head>', mobile_fix + '</head>', 1)

          def div_block(text, class_name):
              m = re.search(r'<div\b[^>]*class=["\'][^"\']*\b' + re.escape(class_name) + r'\b[^"\']*["\'][^>]*>', text)
              if not m:
                  raise SystemExit(f'Could not find {class_name} block')
              token_re = re.compile(r'<div\b[^>]*>|</div>')
              depth = 0
              for token in token_re.finditer(text, m.start()):
                  if token.group().startswith('</div'):
                      depth -= 1
                      if depth == 0:
                          return m.start(), token.end()
                  else:
                      depth += 1
              raise SystemExit(f'Could not close {class_name} block')

          hero_match = re.search(r'<section\b[^>]*class=["\'][^"\']*\bhero\b[^"\']*["\'][^>]*>', html)
          if not hero_match:
              raise SystemExit('Could not find hero section')
          section_start = hero_match.start()
          section_end = html.find('</section>', hero_match.end())
          if section_end < 0:
              raise SystemExit('Could not close hero section')
          hero = html[section_start:section_end]

          a0, a1 = div_block(hero, 'hero-actions')
          v0, v1 = div_block(hero, 'hero-visual')
          if a0 < v0:
              actions = hero[a0:a1]
              hero = hero[:a0] + hero[a1:]
              v0, v1 = div_block(hero, 'hero-visual')
              hero = hero[:v1] + '\n' + actions + hero[v1:]
              html = html[:section_start] + hero + html[section_end:]

          order_id = 'tachyon-hero-order-fix'
          order_fix = '''<style id="tachyon-hero-order-fix">
          .hero .hero-visual{margin-top:32px!important}
          .hero .hero-actions{margin:24px 0 8px!important}
          @media(max-width:580px){
            .hero .hero-visual{margin-top:28px!important}
            .hero .hero-actions{margin:20px 0 6px!important}
          }
          </style>'''
          if order_id in html:
              start = html.index('<style id="tachyon-hero-order-fix">')
              end = html.index('</style>', start) + len('</style>')
              html = html[:start] + order_fix + html[end:]
          else:
              html = html.replace('</head>', order_fix + '</head>', 1)

          # Verify order inside the actual hero section before writing.
          hero_match = re.search(r'<section\b[^>]*class=["\'][^"\']*\bhero\b[^"\']*["\'][^>]*>', html)
          section_end = html.find('</section>', hero_match.end())
          hero = html[hero_match.start():section_end]
          a0, _ = div_block(hero, 'hero-actions')
          v0, _ = div_block(hero, 'hero-visual')
          if not v0 < a0:
              raise SystemExit('Hero reorder verification failed')

          path.write_text(html)
          PY
      - name: Commit homepage patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Tachyon Website Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Move hero image above primary CTAs'
          git push origin HEAD:main
