name: Wire compact homepage demo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-demo-cta.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Switch hero to compact sidebar demo
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text()

          # Point the homepage hero at the purpose-built compact demo.
          html, n = re.subn(
              r'(<iframe\b[^>]*class="tachyon-demo-frame"[^>]*\bsrc=")[^"]+("[^>]*></iframe>)',
              r'\1/demo/embed.html\2',
              html,
              count=1,
          )
          if n != 1:
              raise SystemExit(f'Expected one Tachyon demo iframe, found {n}')

          fit_id = 'tachyon-compact-demo-fit'
          fit_css = '''<style id="tachyon-compact-demo-fit">
          /* Fixed mini-app: sidebar navigation stays visible and the demo never needs vertical scrolling. */
          .tachyon-demo-frame{height:455px!important;overflow:hidden!important}
          @media(max-width:900px){.tachyon-demo-frame{height:430px!important}}
          @media(max-width:580px){
            .tachyon-demo-frame{height:405px!important}
            .tachyon-demo-caption{height:32px!important}
          }
          </style>'''

          if fit_id in html:
              start = html.index('<style id="tachyon-compact-demo-fit">')
              end = html.index('</style>', start) + len('</style>')
              html = html[:start] + fit_css + html[end:]
          else:
              html = html.replace('</head>', fit_css + '</head>', 1)

          if 'src="/demo/embed.html"' not in html:
              raise SystemExit('Compact demo iframe verification failed')
          path.write_text(html)
          PY
      - name: Commit homepage patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Tachyon Website Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Use compact sidebar demo in homepage hero'
          git push origin HEAD:main
