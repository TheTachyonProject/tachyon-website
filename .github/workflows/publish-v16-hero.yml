name: Publish V16 hero

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v16-hero.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild verified V16 hero
        shell: bash
        run: |
          set -euo pipefail
          cat v16/hero/chunk00.txt v16/hero/chunk01_02.txt v16/hero/chunk03_04.txt v16/hero/chunk05_06.txt | tr -d '\r\n' | base64 -d > assets/hero.webp
          test "$(wc -c < assets/hero.webp)" -eq 24730
          file assets/hero.webp | grep -qi 'Web/P image'
          test "$(sha256sum assets/hero.webp | cut -d' ' -f1)" = 'f0e891f558521fc70c545c214278e366f50a582e10931b3e9b838d9f985a43de'
      - name: Commit hero to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Tachyon V16 Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/hero.webp
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'V16: restore verified hero image'
          git push origin HEAD:main
