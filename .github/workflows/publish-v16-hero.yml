name: Publish V16 hero

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v16-hero.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild verified V16 hero
        shell: bash
        run: |
          set -euo pipefail
          cat v16/hero/h0.txt v16/hero/hrest.txt | tr -d '\r\n' | base64 -d > assets/hero.webp
          test "$(wc -c < assets/hero.webp)" -gt 20000
          file assets/hero.webp | grep -qi 'Web/P image'
      - name: Commit hero to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Tachyon V16 Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/hero.webp
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'V16: restore verified hero image'
          git push origin HEAD:main
