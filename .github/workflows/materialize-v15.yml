name: Materialize V15 Production HTML

on:
  push:
    branches:
      - preview-exact-v15-fix
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-exact-v15-fix
      - name: Decode exact V15 into index.html
        shell: python
        run: |
          import base64, gzip
          from pathlib import Path
          parts = [
            'preview_parts/p00.txt',
            'preview_parts/p01.txt',
            'preview_parts/p02_03.txt',
            'preview_parts/p04_05.txt',
            'preview_parts/p06_07.txt',
            'preview_parts/p08_09.txt',
          ]
          encoded = ''.join(Path(p).read_text(encoding='utf-8') for p in parts)
          encoded = ''.join(encoded.split())
          html = gzip.decompress(base64.b64decode(encoded, validate=True)).decode('utf-8')
          if '<html' not in html.lower() or 'tachyon' not in html.lower():
              raise SystemExit('Decoded payload is not valid Tachyon HTML')
          Path('index.html').write_text(html, encoding='utf-8')
          print('Materialized index.html:', len(html.encode('utf-8')), 'bytes')
      - name: Commit materialized V15
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'index.html already materialized'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Materialize exact V15 HTML'
          git push origin HEAD:preview-exact-v15-fix
