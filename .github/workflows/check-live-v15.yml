name: Check Live V15
on:
  push:
    branches: [preview-exact-v15-fix]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose live Tachyon hosting
        shell: bash
        run: |
          set +e
          echo '=== DNS apex ==='
          dig +short tachyonaio.com A
          dig +short tachyonaio.com AAAA
          dig +short tachyonaio.com CNAME
          echo '=== DNS www ==='
          dig +short www.tachyonaio.com A
          dig +short www.tachyonaio.com AAAA
          dig +short www.tachyonaio.com CNAME
          echo '=== HTTPS apex ==='
          curl -sS -L -o /tmp/apex.html -D /tmp/apex.headers -w 'FINAL_URL=%{url_effective}\nHTTP=%{http_code}\n' https://tachyonaio.com/
          cat /tmp/apex.headers
          head -c 500 /tmp/apex.html; echo
          echo '=== HTTPS www ==='
          curl -sS -L -o /tmp/www.html -D /tmp/www.headers -w 'FINAL_URL=%{url_effective}\nHTTP=%{http_code}\n' https://www.tachyonaio.com/
          cat /tmp/www.headers
          head -c 500 /tmp/www.html; echo
          echo '=== Known GitHub raw main ==='
          curl -sS -L -o /tmp/raw.css -w 'RAW_HTTP=%{http_code}\n' https://raw.githubusercontent.com/TheTachyonProject/tachyon-website/main/styles.css
          printf 'RAW_CSS_GIT_BLOB='
          printf 'blob %s\0' "$(wc -c < /tmp/raw.css)" | cat - /tmp/raw.css | sha1sum | awk '{print $1}'
